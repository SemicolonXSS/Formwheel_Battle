<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FormWheel — Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7FB;--surface:#FFFFFF;--surface-2:#F1F1F8;--border:#E6E6F0;
  --text:#18181B;--muted:#71717A;--accent:#4F46E5;--accent-soft:#EEF0FF;
  --c-a:#FF6B6B;--c-b:#22B8CF;--c-c:#FFB020;--c-d:#7C5CFC;
  --good:#16A34A;--bad:#E11D48;--fire:#F97316;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100%}
button,input,select{font:inherit}
#app{min-height:100vh;display:flex;flex-direction:column}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;border:none;background:none;padding:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.wordmark{font-weight:700;font-size:16px}.tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px}
.nav-meta{font-size:13px;color:var(--muted)}.nav-meta b{color:var(--text);letter-spacing:1px}
main{flex:1;display:flex;justify-content:center;padding:28px 18px 48px}
.stage{width:100%;max-width:460px;display:flex;flex-direction:column}.wide{max-width:720px}
.title{font-weight:800;font-size:24px;line-height:1.3;margin:0 0 6px}.sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.home-choice{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.home-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:20px;text-align:left;cursor:pointer;color:var(--text)}
.home-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.home-card h3{margin:0 0 4px;font-size:17px}.home-card p{margin:0;color:var(--muted);font-size:13.5px}
.field{margin-bottom:16px}label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=tel],select{width:100%;background:var(--surface);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:12px 13px;font-size:15.5px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:14px 20px;font-size:15.5px;font-weight:700;cursor:pointer;width:100%;color:#fff;background:var(--accent);transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}.btn.ghost{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}.btn:disabled{opacity:.4;cursor:not-allowed}
.pin-box{background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:14px;padding:24px 20px;text-align:center;margin-bottom:20px}
.plabel{color:var(--accent);font-size:12.5px;font-weight:700;margin-bottom:6px}.pin{font-size:46px;font-weight:800;letter-spacing:6px}
.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.player-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:18px;text-align:center}
.player-card.fire{border-color:#FDBA74;background:#FFF7ED}.player-card.water{border-color:#A5F3FC;background:#ECFEFF}
.player-icon{font-size:28px}.player-name{font-weight:800;margin-top:5px}.score{font-size:28px;font-weight:800;margin-top:8px}
.vs{text-align:center;font-weight:800;color:var(--muted);margin:-2px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.mini{color:var(--muted);font-size:13.5px;font-weight:600}
.timer-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}.timer-track{flex:1;height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden}.timer-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .2s linear}.urgent{background:var(--bad)!important}.timer-num{font-weight:800;font-size:15px;color:var(--accent);min-width:34px;text-align:right}
.qtext{font-weight:800;font-size:20px;line-height:1.4;margin:0 0 18px}.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:none;border-radius:12px;color:#fff;font-weight:700;font-size:15.5px;padding:20px 12px;min-height:92px;cursor:pointer;text-align:left}
.choice.a{background:var(--c-a)}.choice.b{background:var(--c-b)}.choice.c{background:var(--c-c)}.choice.d{background:var(--c-d)}
.choice:disabled{opacity:.35}.choice.picked{outline:3px solid var(--text);outline-offset:-3px}.choice.dim{opacity:.25}
.center{text-align:center;padding:42px 0}.big{font-size:48px;margin-bottom:8px}
.result-card{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 20px;margin-bottom:14px}
.result-score{font-size:38px;font-weight:800;margin:8px 0 18px}.winner{font-size:16px;font-weight:700;color:var(--accent)}
.lead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-2);border-radius:10px;margin-bottom:8px}.lead.me{border:1.5px solid var(--accent)}.lead .name{font-weight:600}.lead .pts{font-weight:800;color:var(--accent)}
.error{color:var(--bad);font-size:13px;margin-top:10px}.actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.mode-row{display:flex;gap:8px;flex-wrap:wrap}.mode{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;cursor:pointer;color:var(--muted)}.mode.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.note{padding:12px 14px;background:var(--surface-2);border-radius:10px;color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:16px}
@media(max-width:520px){.choices-grid,.player-grid{gap:9px}.choice{min-height:82px;padding:16px 10px}.pin{font-size:40px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";

const HOME="https://semicolonxss.github.io/Formwheel/";
const firebaseConfig={
  apiKey:"AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",
  authDomain:"formwheel.firebaseapp.com",
  databaseURL:"https://formwheel-default-rtdb.firebaseio.com/",
  projectId:"formwheel",
  storageBucket:"formwheel.firebasestorage.app",
  messagingSenderId:"431583088241",
  appId:"1:431583088241:web:74e0e34ea1e3e1170c55d0"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const QUESTIONS=[
 {text:"다음 중 대한민국의 수도는 어디일까요?",choices:["부산","서울","인천","대구"],correct:1},
 {text:"물의 화학식은 무엇일까요?",choices:["CO2","O2","H2O","NaCl"],correct:2},
 {text:"태양계에서 가장 큰 행성은?",choices:["지구","목성","화성","토성"],correct:1},
 {text:"1년은 총 며칠일까요? (평년 기준)",choices:["364일","365일","366일","360일"],correct:1}
];

let screen="home", pin="", playerId="", playerName="", role="", mode="1v1", timeLimit=10;
let qi=0, timer=null, unsub=[], picked=null, localStart=0;
let hostName="", opponentName="상대를 기다리는 중";
let hostScore=0, opponentScore=0, battleQuestions=QUESTIONS;
let libraryQuizzes=[], selectedQuizId="";

const app=document.getElementById("app");

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function clearTimer(){if(timer){clearInterval(timer);timer=null;}}
function cleanup(){unsub.forEach(fn=>{try{fn()}catch(e){}});unsub=[];clearTimer();}
function nav(right=""){return `<div class="navbar"><button class="brand" id="brand"><span class="mark">F</span><span class="wordmark">FormWheel</span><span class="tag">Battle</span></button><span class="nav-meta">${right}</span></div>`;}
function wire(){const b=document.getElementById("brand");if(b)b.onclick=()=>window.open(HOME,"_blank");}
function go(s){cleanup();screen=s;render();}
function pin4(){return Math.floor(1000+Math.random()*9000).toString();}
function randomId(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function battleRef(){return db.ref("battle/"+pin);}
function playersRef(){return battleRef().child("players");}

function render(){
  if(screen==="home")home();
  else if(screen==="setup")setup();
  else if(screen==="hostLobby")hostLobby();
  else if(screen==="join")join();
  else if(screen==="playerLobby")playerLobby();
  else if(screen==="hostQuestion")hostQuestion();
  else if(screen==="playerQuestion")playerQuestion();
  else if(screen==="reveal")reveal();
  else if(screen==="final")final();
  wire();
}

function home(){
app.innerHTML=nav()+`<main><div class="stage">
<h1 class="title">Battle 만들기</h1>
<p class="sub">Quiz의 문제를 이용해서 친구와 실시간으로 대결해보세요.</p>
<div class="home-choice">
<div class="home-card" id="make"><h3>⚔️ Battle 만들기</h3><p>Quiz를 선택하고 친구와 겨룰 Battle을 만들어요.</p></div>
<div class="home-card" id="join"><h3>🚪 참가하기</h3><p>친구에게 받은 4자리 코드를 입력하고 참가해요.</p></div>
</div></div></main>`;
document.getElementById("make").onclick=()=>{role="host";go("setup")};
document.getElementById("join").onclick=()=>{role="player";go("join")};
}

async function setup(){
app.innerHTML=nav()+`<main><div class="stage">
<h1 class="title">Battle 만들기</h1>
<p class="sub">Quiz를 선택하고 친구에게 4자리 코드를 보내세요.</p>
<div class="card">
<div class="field"><label>내 닉네임</label><input id="hostName" type="text" maxlength="12" placeholder="닉네임을 입력해주세요"></div>
<div class="field"><label>사용할 Quiz</label><select id="quiz"><option>불러오는 중…</option></select></div>
<div class="field"><label>Battle 방식</label><div class="mode-row"><button class="mode active">⚔️ 1 vs 1</button><button class="mode" disabled>👥 팀전 (준비 중)</button></div></div>
<div class="field"><label>문제당 제한 시간</label><div class="mode-row" id="timeRow">${[10,15,20,30].map(t=>`<button class="mode ${timeLimit===t?"active":""}" data-time="${t}">${t}초</button>`).join("")}</div></div>
<div class="note" id="quizNote">FormWheel Quiz에서 만든 문제를 그대로 가져와서 Battle에 쓸 수 있어요.</div>
<button class="btn" id="create">⚔️ Battle 만들고 코드 받기</button>
<div class="error" id="err"></div>
</div></div></main>`;
wire();
document.querySelectorAll("[data-time]").forEach(b=>b.onclick=()=>{timeLimit=+b.dataset.time;updateTimeButtons()});

try{
  const snap=await db.ref("quizzes").once("value");
  const val=snap.val()||{};
  libraryQuizzes=Object.entries(val).map(([id,q])=>({id,...q})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}catch(e){libraryQuizzes=[];}

const sel=document.getElementById("quiz");
if(!sel)return; // 화면이 이미 바뀐 경우
if(libraryQuizzes.length===0){
  sel.innerHTML=`<option value="">🧠 기본 Quiz — 4문제</option>`;
  battleQuestions=QUESTIONS;selectedQuizId="";
  document.getElementById("quizNote").textContent="아직 FormWheel Quiz에서 만든 문제가 없어서, 기본 샘플 문제로 진행돼요.";
}else{
  sel.innerHTML=libraryQuizzes.map(q=>`<option value="${q.id}">📝 ${esc(q.title||"제목 없는 Quiz")} — ${(q.questions||[]).length}문제</option>`).join("")
    +`<option value="">🧠 기본 Quiz — 4문제</option>`;
  const first=libraryQuizzes[0];
  battleQuestions=first.questions||QUESTIONS;selectedQuizId=first.id;
  if(first.timeLimit)timeLimit=first.timeLimit;
  document.getElementById("quizNote").textContent="FormWheel Quiz에서 만든 문제 목록이에요. 고르면 그 문제 그대로 Battle이 시작돼요.";
}
sel.onchange=()=>{
  const chosen=libraryQuizzes.find(q=>q.id===sel.value);
  if(chosen){
    battleQuestions=chosen.questions||QUESTIONS;selectedQuizId=chosen.id;
    if(chosen.timeLimit){timeLimit=chosen.timeLimit;updateTimeButtons();}
  }else{
    battleQuestions=QUESTIONS;selectedQuizId="";
  }
};
updateTimeButtons();

document.getElementById("create").onclick=async()=>{
  const n=document.getElementById("hostName").value.trim(),err=document.getElementById("err");
  if(!n){err.textContent="닉네임을 입력해주세요.";return}
  if(!battleQuestions||battleQuestions.length===0){err.textContent="문제가 없어요. 다른 Quiz를 선택해주세요.";return}
  const p=pin4(), id=randomId();
  try{
    const snap=await db.ref("battle/"+p).once("value");
    if(snap.exists()){document.getElementById("create").click();return}
    pin=p;playerId=id;playerName=n;hostName=n;
    await battleRef().set({
      meta:{hostId:id,hostName:n,mode:"1v1",timeLimit,createdAt:firebase.database.ServerValue.TIMESTAMP,questions:battleQuestions},
      state:{phase:"lobby",round:-1,startedAt:0},
      players:{[id]:{name:n,score:0,role:"host",joinedAt:firebase.database.ServerValue.TIMESTAMP}}
    });
    go("hostLobby");
  }catch(e){err.textContent="Firebase 연결에 실패했어요: "+e.message;}
};
}

function updateTimeButtons(){
  document.querySelectorAll("[data-time]").forEach(b=>{
    b.classList.toggle("active", +b.dataset.time===timeLimit);
  });
}

function hostLobby(){
app.innerHTML=nav(`코드 <b>${pin}</b>`)+`<main><div class="stage wide">
<div class="pin-box"><div class="plabel">Battle 참가 코드</div><div class="pin">${pin}</div></div>
<p class="sub" style="text-align:center">친구에게 이 코드를 알려주세요. 친구가 참가하면 자동으로 표시됩니다.</p>
<div id="lobbyPlayers" class="player-grid"></div>
<div class="actions"><button class="btn" id="start" disabled>상대방을 기다리는 중…</button><button class="btn ghost" id="cancel">취소하고 처음으로</button></div>
<div class="error" id="err"></div>
</div></main>`;
document.getElementById("cancel").onclick=()=>go("home");

const ref=playersRef();
const cb=s=>{
 const ps=Object.entries(s.val()||{}).map(([id,p])=>({id,...p}));
 const opponent=ps.find(p=>p.role==="player");
 opponentName=opponent?opponent.name:"상대를 기다리는 중";
 document.getElementById("lobbyPlayers").innerHTML=`
 <div class="player-card fire"><div class="player-icon">🔥</div><div class="player-name">${esc(hostName)}</div><div class="score">${hostScore}</div></div>
 <div class="player-card water"><div class="player-icon">💧</div><div class="player-name">${esc(opponentName)}</div><div class="score">${opponent?opponent.score:"—"}</div></div>`;
 const btn=document.getElementById("start");
 if(opponent){btn.disabled=false;btn.textContent="⚔️ Battle 시작하기";}
};
ref.on("value",cb);unsub.push(()=>ref.off("value",cb));

const stateRef=battleRef().child("state");
const stateCb=s=>{const st=s.val();if(st&&st.phase==="question"&&st.round>=0){qi=st.round;go("hostQuestion")}};
stateRef.on("value",stateCb);unsub.push(()=>stateRef.off("value",stateCb));

document.getElementById("start").onclick=async()=>{
 try{await stateRef.set({phase:"question",round:0,startedAt:firebase.database.ServerValue.TIMESTAMP})}
 catch(e){document.getElementById("err").textContent=e.message}
};
}

function join(){
app.innerHTML=nav()+`<main><div class="stage">
<h1 class="title">Battle 참가하기</h1><p class="sub">친구에게 받은 코드와 닉네임을 입력하세요.</p>
<div class="field"><label>Battle 코드</label><input id="pin" type="tel" maxlength="4" placeholder="예: 4821"></div>
<div class="field"><label>닉네임</label><input id="name" type="text" maxlength="12" placeholder="닉네임"></div>
<button class="btn" id="enter">참가하기</button><div class="error" id="err"></div>
<button class="btn ghost" id="back" style="margin-top:10px">뒤로가기</button>
</div></main>`;
document.getElementById("back").onclick=()=>go("home");
document.getElementById("enter").onclick=async()=>{
 const p=document.getElementById("pin").value.trim(),n=document.getElementById("name").value.trim(),e=document.getElementById("err");
 if(!/^\d{4}$/.test(p)){e.textContent="4자리 코드를 입력해주세요.";return}
 if(!n){e.textContent="닉네임을 입력해주세요.";return}
 try{
   const snap=await db.ref("battle/"+p).once("value");
   if(!snap.exists()){e.textContent="존재하지 않는 Battle 코드예요.";return}
   const data=snap.val(), ps=data.players||{};
   if(Object.values(ps).some(x=>x.role==="player")){e.textContent="이미 상대가 참가한 Battle이에요.";return}
   pin=p;playerName=n;playerId=randomId();
   battleQuestions=data.meta.questions||QUESTIONS;timeLimit=data.meta.timeLimit||10;
   await db.ref("battle/"+p+"/players/"+playerId).set({name:n,score:0,role:"player",joinedAt:firebase.database.ServerValue.TIMESTAMP});
   go("playerLobby");
 }catch(err){e.textContent="Firebase 연결에 실패했어요: "+err.message}
};
}

function playerLobby(){
app.innerHTML=nav(`코드 <b>${pin}</b>`)+`<main><div class="stage"><div class="center">
<div class="big">⚔️</div><h1 class="title">${esc(playerName)}님, 참가 완료!</h1>
<p class="sub">상대방이 Battle을 시작하면 자동으로 문제가 나옵니다.</p></div></div></main>`;
const ref=battleRef().child("state");
const cb=s=>{const st=s.val();if(st&&st.phase==="question"){qi=st.round||0;go("playerQuestion")}};
ref.on("value",cb);unsub.push(()=>ref.off("value",cb));
}

function getQ(){return battleQuestions[qi]||QUESTIONS[qi]||QUESTIONS[0];}

function questionScreen(){
 picked=null;
 const q=getQ();
 app.innerHTML=nav(`코드 <b>${pin}</b>`)+`<main><div class="stage wide">
 <div class="topbar"><span class="mini">ROUND ${qi+1} / ${battleQuestions.length}</span><span class="mini">🔥 ${hostScore} &nbsp; : &nbsp; ${opponentScore} 💧</span></div>
 <div class="timer-row"><div class="timer-track"><div class="timer-fill" id="fill" style="width:100%"></div></div><div class="timer-num" id="tnum">${timeLimit}s</div></div>
 <div class="qtext">${esc(q.text)}</div>
 <div class="choices-grid" id="choices">${q.choices.map((c,i)=>`<button class="choice ${"abcd"[i]}" data-i="${i}">${esc(c)}</button>`).join("")}</div>
 <div class="note" id="status">정답을 하나 선택하세요.</div>
 </div></main>`;
 document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>submitAnswer(+b.dataset.i));
 runTimer();
 watchAnswers();
 const sr=battleRef().child("state"), sc=s=>{const st=s.val();if(st&&st.phase==="reveal"&&st.round===qi)go("reveal");if(st&&st.phase==="final")go("final")};
 sr.on("value",sc);unsub.push(()=>sr.off("value",sc));
}
function hostQuestion(){questionScreen();}
function playerQuestion(){questionScreen();}

function runTimer(){
 clearTimer();localStart=Date.now();
 timer=setInterval(async()=>{
   const elapsed=(Date.now()-localStart)/1000,remain=Math.max(0,Math.ceil(timeLimit-elapsed)),pct=Math.max(0,100*(1-elapsed/timeLimit));
   const f=document.getElementById("fill"),tn=document.getElementById("tnum");
   if(f)f.style.width=pct+"%";if(tn)tn.textContent=remain+"s";
   if(remain<=5){if(f)f.classList.add("urgent");if(tn)tn.classList.add("urgent")}
   if(elapsed>=timeLimit){clearTimer();if(picked===null)await submitAnswer(-1);}
 },100);
}

async function submitAnswer(i){
 if(picked!==null)return;picked=i;clearTimer();
 document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(+b.dataset.i!==i)b.classList.add("dim");else b.classList.add("picked")});
 const q=getQ(),correct=i===q.correct;
 const points=correct?1:0;
 try{
   const pRef=battleRef().child("players").child(playerId);
   // rounds 기록과 score 갱신을 하나의 update()로 묶어 원자적으로 반영합니다.
   // (이전에는 두 번의 별도 write로 나뉘어 있어서, 상대 기기가 "답변 완료" 신호를
   // rounds 필드만 보고 감지할 때 score가 아직 반영되지 않은 순간을 읽어버리는
   // 경쟁 조건이 있었습니다. 이게 기기마다 점수가 다르게 보이던 원인입니다.)
   const curSnap=await pRef.child("score").once("value");
   const newScore=(curSnap.val()||0)+points;
   await pRef.update({
     score:newScore,
     ["rounds/"+qi]:{answer:i,correct,points,at:firebase.database.ServerValue.TIMESTAMP}
   });
   const st=document.getElementById("status");
   if(st)st.textContent=correct?"정답 제출 완료!":"답변 제출 완료!";
 }catch(e){const st=document.getElementById("status");if(st)st.textContent="답변 저장 실패: "+e.message}
}

function watchAnswers(){
 const round=String(qi);
 const ref=playersRef();
 const cb=s=>{
   const ps=s.val()||{}, list=Object.values(ps);
   const answered=list.filter(p=>p.rounds&&p.rounds[round]);
   const st=document.getElementById("status");
   if(st)st.textContent=`답변 ${answered.length} / 2`;
   if(answered.length>=2) finalizeRoundIfNeeded();
 };
 ref.on("value",cb);unsub.push(()=>ref.off("value",cb));
}

async function finalizeRoundIfNeeded(){
 const snap=await playersRef().once("value"),ps=snap.val()||{},arr=Object.values(ps);
 if(arr.length<2)return;
 const answers=arr.map(p=>p.rounds?p.rounds[String(qi)]:null).filter(Boolean);
 if(answers.length<2)return;
 const st=await battleRef().child("state").once("value"),current=st.val()||{};
 if(current.phase!=="question"||current.round!==qi)return;
 await battleRef().child("state").set({phase:"reveal",round:qi,revealedAt:firebase.database.ServerValue.TIMESTAMP});
}

async function reveal(){
 const snap=await playersRef().once("value"),ps=snap.val()||{},arr=Object.values(ps);
 const host=arr.find(p=>p.role==="host")||{name:hostName,score:0},player=arr.find(p=>p.role==="player")||{name:opponentName,score:0};
 hostName=host.name;opponentName=player.name;hostScore=host.score||0;opponentScore=player.score||0;
 const me=role==="host"?host:player, other=role==="host"?player:host;
 app.innerHTML=nav(`코드 <b>${pin}</b>`)+`<main><div class="stage">
 <div class="result-card"><div class="big">⚔️</div><h1 class="title">ROUND ${qi+1} 결과</h1>
 <div class="result-score">${me.score||0} : ${other.score||0}</div><div class="winner">${esc(me.name)} ${((me.score||0)>(other.score||0))?"앞서는 중":((me.score||0)===(other.score||0)?"동점":"추격 중")}!</div></div>
 <div class="lead"><span class="name">🔥 ${esc(host.name)}</span><span class="pts">${host.score||0}점</span></div>
 <div class="lead"><span class="name">💧 ${esc(player.name)}</span><span class="pts">${player.score||0}점</span></div>
 <div class="actions">${role==="host"?`<button class="btn" id="next">${qi===battleQuestions.length-1?"최종 결과 보기":"다음 문제"}</button>`:`<div class="note" style="text-align:center">진행자가 다음 문제를 시작할 때까지 잠시만 기다려주세요.</div>`}</div>
 </div></main>`;
 wire();
 if(role==="host")document.getElementById("next").onclick=async()=>{
   if(qi===battleQuestions.length-1)await battleRef().child("state").set({phase:"final",round:qi});
   else await battleRef().child("state").set({phase:"question",round:qi+1,startedAt:firebase.database.ServerValue.TIMESTAMP});
 };
 const ref=battleRef().child("state"),cb=s=>{
   const st=s.val();if(!st)return;
   if(st.phase==="question"&&st.round!==qi){qi=st.round;go(role==="host"?"hostQuestion":"playerQuestion");return}
   if(st.phase==="final")go("final");
 };
 ref.on("value",cb);unsub.push(()=>ref.off("value",cb));
}

function final(){
 app.innerHTML=nav(`코드 <b>${pin}</b>`)+`<main><div class="stage">
 <div class="result-card"><div class="big">🏆</div><h1 class="title">Battle 종료!</h1>
 <div class="result-score" id="finalScore">결과 계산 중…</div><div class="winner" id="finalWinner"></div></div>
 <div id="finalList"></div>
 <div class="actions"><button class="btn" id="again">🔄 새 Battle 만들기</button><button class="btn ghost" id="quiz">📝 FormWheel로 돌아가기</button></div>
 </div></main>`;
 playersRef().once("value").then(s=>{
   const arr=Object.entries(s.val()||{}).map(([id,p])=>({id,...p})).sort((a,b)=>(b.score||0)-(a.score||0));
   const me=arr.find(p=>p.id===playerId)||arr[0]||{name:playerName,score:0};
   const other=arr.find(p=>p.id!==me.id)||{name:"상대",score:0};
   document.getElementById("finalScore").textContent=`${me.score||0} : ${other.score||0}`;
   document.getElementById("finalWinner").textContent=(me.score||0)>(other.score||0)?`🏆 ${me.name} 승리!`:(me.score||0)===(other.score||0)?"🤝 무승부!":`💥 ${other.name} 승리!`;
   document.getElementById("finalList").innerHTML=arr.map((p,i)=>`<div class="lead ${p.id===playerId?"me":""}"><span class="name">${i===0?"🏆 ":""}${esc(p.name)}</span><span class="pts">${p.score||0}점</span></div>`).join("");
 });
 document.getElementById("again").onclick=()=>{pin="";qi=0;go("setup")};
 document.getElementById("quiz").onclick=()=>window.open(HOME,"_blank");
}

render();
})();
</script>
</body>
